spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: red-social-api
  datasource:
    # Fallback local. En producción, si DATABASE_URL está definida
    # (postgresql://user:pass@host:port/db), DatabaseUrlEnvironmentPostProcessor
    # la traduce y tiene prioridad sobre estas DB_*.
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:55432}/${DB_NAME:redsocial}
    username: ${DB_USER:redsocial}
    password: ${DB_PASSWORD:redsocial}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_VIDEO_BYTES:52428800}
      max-request-size: ${MEDIA_MAX_REQUEST_BYTES:57671680}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: true

server:
  port: ${API_PORT:8080}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:red-social-super-secret-key-change-me-in-production-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:8081}
  seed:
    enabled: false
  media:
    storage: ${MEDIA_STORAGE:auto}
    local-dir: ${MEDIA_LOCAL_DIR:uploads}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
    max-image-bytes: ${MEDIA_MAX_IMAGE_BYTES:8388608}
    max-video-bytes: ${MEDIA_MAX_VIDEO_BYTES:52428800}
  cloudinary:
    url: ${CLOUDINARY_URL:}
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:redsocial}
  s3:
    enabled: ${S3_ENABLED:false}
    bucket: ${S3_BUCKET:}
    region: ${S3_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    path-style-access: ${S3_PATH_STYLE:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO
    com.redsocial: INFO
