services:
  postgres:
    image: postgres:16-alpine
    container_name: red-social-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-redsocial}
      POSTGRES_USER: ${DB_USER:-redsocial}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-redsocial}
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - red-social-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-redsocial} -d ${DB_NAME:-redsocial}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: red-social-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@redsocial.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  red-social-pgdata:
