name: Deploy red-social (backend + frontend)

on:
  push:
    branches: [mainlastest]
    paths:
      - "red-social-api/**"
      - "red-social-ui/**"
      - "red-social-common/**"
      - "pom.xml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Backend (red-social-api) — Spring Boot REST, puerto 8080
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Filtrar rutas (backend)
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'red-social-api/**'
              - 'red-social-common/**'
              - 'pom.xml'
              - '.github/workflows/deploy.yml'

      - name: Calcular image base (GHCR exige minúsculas)
        if: ${{ steps.filter.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
        run: echo "IMAGE_BASE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        if: ${{ steps.filter.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/setup-buildx-action@v3

      - name: Login a GitHub Container Registry
        if: ${{ steps.filter.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Contexto = raíz del monorepo: el Dockerfile necesita el pom padre + red-social-common.
      - name: Build y push backend
        if: ${{ steps.filter.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./red-social-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/red-social-api:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/red-social-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Tag INMUTABLE (sha): CapRover/Docker Swarm no re-descarga un :latest ya cacheado.
      - name: Deploy backend a CapRover
        if: ${{ steps.filter.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: '${{ secrets.CAPROVER_SERVER }}'
          app: '${{ secrets.CAPROVER_APP_NAME_BACKEND }}'
          token: '${{ secrets.CAPROVER_APP_TOKEN_BACKEND }}'
          image: '${{ env.IMAGE_BASE }}/red-social-api:${{ github.sha }}'

  # ═══════════════════════════════════════════════════════════════════════════
  # Frontend (red-social-ui) — Vaadin, puerto 8081
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Filtrar rutas (frontend)
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'red-social-ui/**'
              - 'red-social-common/**'
              - 'pom.xml'
              - '.github/workflows/deploy.yml'

      - name: Calcular image base (GHCR exige minúsculas)
        if: ${{ steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
        run: echo "IMAGE_BASE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        if: ${{ steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/setup-buildx-action@v3

      - name: Login a GitHub Container Registry
        if: ${{ steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Contexto = raíz del monorepo. El build compila el bundle de Vaadin en modo producción.
      - name: Build y push frontend
        if: ${{ steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./red-social-ui/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/red-social-ui:${{ github.sha }}
            ${{ env.IMAGE_BASE }}/red-social-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Tag INMUTABLE (sha) por la misma razón que el backend.
      - name: Deploy frontend a CapRover
        if: ${{ steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: '${{ secrets.CAPROVER_SERVER }}'
          app: '${{ secrets.CAPROVER_APP_NAME_FRONTEND }}'
          token: '${{ secrets.CAPROVER_APP_TOKEN_FRONTEND }}'
          image: '${{ env.IMAGE_BASE }}/red-social-ui:${{ github.sha }}'
