server:
  port: ${UI_PORT:8081}

spring:
  application:
    name: red-social-ui
  web:
    resources:
      # En dev sirve primero los archivos fuente para que los cambios en
      # /static se reflejen sin reiniciar; en el jar caen al classpath.
      static-locations: file:src/main/resources/static/,file:red-social-ui/src/main/resources/static/,classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/

app:
  api:
    base-url: ${API_BASE_URL:http://localhost:8080/api}

vaadin:
  launch-browser: false
  allowed-packages: com.redsocial.ui
  frontend:
    hotdeploy: true

logging:
  level:
    com.redsocial: INFO
